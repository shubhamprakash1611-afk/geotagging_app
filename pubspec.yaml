name: geotagging_app
description: GPS Map Camera with geotagging dashboard overlay

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Camera ---
  camera: ^0.10.5+9

  # --- Location & Maps (100% Free) ---
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # --- Sensors (On-Device, Free) ---
  sensors_plus: ^5.0.1

  # --- Networking (for free Open-Meteo weather API) ---
  http: ^1.2.0

  # --- Image Processing ---
  image: ^4.1.7

  # --- File System & Gallery ---
  path_provider: ^2.1.2
  # --- State Management ---
  provider: ^6.1.1

  # --- Permissions ---
  permission_handler: ^11.3.0

  # --- Security (Free RASP) ---
  freerasp: ^6.1.0

  # --- Utilities ---
  intl: ^0.19.0

  # --- Map Tile Caching (Offline Support) ---
  flutter_map_tile_caching: ^9.0.0
  image_gallery_saver_plus: ^5.1.1
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  uuid: ^4.6.0
  audioplayers: ^6.8.1
  url_launcher: ^6.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
